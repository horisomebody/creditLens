[project]
name = "creditlens-ml"
version = "0.1.0"
description = "CreditLens 데이터 탐색·전처리·모델링(Python)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
    "xgboost>=3.4.1",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]
